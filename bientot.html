<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#030d1f">
  <title>Hasta La Vista — 1 de diciembre</title>
  <link rel="icon" type="image/png" href="/hasta-la-vista/icono.png">
  <link rel="apple-touch-icon" href="/hasta-la-vista/apple-touch-icon.png">
  <link rel="stylesheet" href="/bientot.css">
  <script src="/bientot.js" defer></script>
</head>
<body>
  <canvas id="cielo" aria-hidden="true"></canvas>
  <main class="veil" aria-labelledby="veil-title">
    <img class="veil-logo" src="/hasta-la-vista/icone-512.png" alt="" width="132" height="132">
    <p class="veil-kicker" data-t="kicker">Hasta La Vista · El Agua</p>
    <h1 id="veil-title" data-t="title">La primera estrella se enciende pronto</h1>
    <p class="veil-date" data-t="date">Martes 1 de diciembre a medianoche, hora de París.</p>
    <div class="veil-count" role="timer" aria-live="off">
      <div><span id="d">00</span><small data-t="days">días</small></div>
      <div><span id="h">00</span><small data-t="hours">horas</small></div>
      <div><span id="m">00</span><small data-t="minutes">minutos</small></div>
      <div><span id="s">00</span><small data-t="seconds">segundos</small></div>
    </div>
    <p class="veil-line" data-t="line">«Adiós» no quiere decir «nunca». A medianoche, cada creador se vuelve una estrella.</p>
    <p class="veil-sub" data-t="sub">Cada noche, el cielo se llena un poco más.</p>
  </main>
</body>
</html>
